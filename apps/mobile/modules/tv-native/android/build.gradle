plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.tvnative'
version = '0.1.0'

android {
  namespace "expo.modules.tvnative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // React Native already ships OkHttp; compile against the same version it bundles
  // (node_modules/react-native/gradle/libs.versions.toml) to avoid duplicate classes.
  compileOnly "com.squareup.okhttp3:okhttp:4.9.2"
}
